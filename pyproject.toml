[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "archbot-evidence"
version = "0.1.0"
description = "Non-executing FastAPI route extraction — first milestone of ARCHBOT Evidence"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
archbot-routes = "archbot.cli:main"

[tool.setuptools.packages.find]
include = ["archbot*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
